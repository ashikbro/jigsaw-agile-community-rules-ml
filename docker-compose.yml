version: '3.8'

services:
  # Content Moderation API Server
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: content-moderation-api
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - NLTK_DATA=/app/nltk_data
    volumes:
      - ./models:/app/models:ro
      - ./logs:/app/logs
      - ./outputs:/app/outputs
    command: ["python", "api_server.py"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    networks:
      - content-moderation

  # Streamlit Demo Interface
  streamlit:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: content-moderation-streamlit
    ports:
      - "8501:8501"
    environment:
      - PYTHONUNBUFFERED=1
      - NLTK_DATA=/app/nltk_data
    volumes:
      - ./models:/app/models:ro
      - ./logs:/app/logs
      - ./outputs:/app/outputs
    command: ["streamlit", "run", "streamlit_demo.py", "--server.port=8501", "--server.address=0.0.0.0"]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - content-moderation

  # Redis for caching and rate limiting (optional)
  redis:
    image: redis:7-alpine
    container_name: content-moderation-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    networks:
      - content-moderation

  # Nginx reverse proxy for load balancing
  nginx:
    image: nginx:alpine
    container_name: content-moderation-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
      - streamlit
    restart: unless-stopped
    networks:
      - content-moderation

  # Monitoring with Prometheus (optional)
  prometheus:
    image: prom/prometheus:latest
    container_name: content-moderation-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    restart: unless-stopped
    networks:
      - content-moderation

  # Grafana for visualization (optional)
  grafana:
    image: grafana/grafana:latest
    container_name: content-moderation-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin123
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - content-moderation

volumes:
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

networks:
  content-moderation:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16